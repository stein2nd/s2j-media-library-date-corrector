name: PHPUnit

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start wp-env (tests)
        run: bash bin/wp-env-start-tests-ci.sh

      - name: Run PHPUnit in wp-env
        run: npm run test:unit:php

      - name: Stop wp-env (tests)
        if: always()
        run: npm run wp-env:stop:tests || true
